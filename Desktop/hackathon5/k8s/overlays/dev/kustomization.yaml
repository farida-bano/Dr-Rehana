apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

bases:
  - ../../base

replicas:
  - name: digital-fte-backend
    count: 1
  - name: postgres
    count: 1
  - name: redis
    count: 1
  - name: kafka
    count: 1

patchesStrategicMerge:
  - deployment-patch.yaml

configMapGenerator:
  - name: digital-fte-config
    behavior: merge
    literals:
      - LOG_LEVEL=DEBUG
      - ENABLE_METRICS=true

namespace: dev
