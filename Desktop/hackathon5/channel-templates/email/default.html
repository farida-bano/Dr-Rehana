    </style>
</head>

    <div class="container">
        <div class="header">
            <h2>Support Response</h2>
        </div>

        </div>
        <div class="footer">
            <p>This is an automated response. Please do not reply to this email.</p>
        </div>
    </div>
</body>
</html>
