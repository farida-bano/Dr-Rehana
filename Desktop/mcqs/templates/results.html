<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Results - AI Agent Factory</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --secondary: #8b5cf6;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --gray-50: #f9fafb;
            --gray-100: #f3f4f6;
            --gray-200: #e5e7eb;
            --gray-300: #d1d5db;
            --gray-500: #6b7280;
            --gray-700: #374151;
            --gray-900: #111827;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
            color: var(--gray-900);
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15);
            padding: 50px;
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 10px;
            letter-spacing: -0.5px;
        }

        .header p {
            color: var(--gray-500);
            font-size: 15px;
            font-weight: 500;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
            padding: 30px 25px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(99, 102, 241, 0.15);
            transition: transform 0.2s;
        }

        .stat-card:hover {
            transform: translateY(-4px);
        }

        .stat-card .number {
            font-size: 36px;
            font-weight: 700;
            margin: 12px 0;
            letter-spacing: -0.5px;
        }

        .stat-card .label {
            font-size: 13px;
            opacity: 0.95;
            font-weight: 600;
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }

        .table-section {
            overflow-x: auto;
            margin-bottom: 30px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: var(--gray-50);
            border-bottom: 2px solid var(--primary);
        }

        th {
            padding: 16px 14px;
            text-align: left;
            font-weight: 700;
            color: var(--primary);
            font-size: 13px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        td {
            padding: 16px 14px;
            border-bottom: 1px solid var(--gray-200);
            color: var(--gray-700);
            font-size: 14px;
        }

        tbody tr {
            transition: background-color 0.2s;
        }

        tbody tr:hover {
            background: var(--gray-50);
        }

        .rank {
            font-weight: 700;
            color: var(--primary);
            font-size: 15px;
        }

        .name {
            font-weight: 600;
            color: var(--gray-900);
        }

        .score-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 13px;
            letter-spacing: 0.3px;
        }

        .score-excellent {
            background: rgba(16, 185, 129, 0.15);
            color: #059669;
        }

        .score-good {
            background: rgba(59, 130, 246, 0.15);
            color: #1e40af;
        }

        .score-average {
            background: rgba(245, 158, 11, 0.15);
            color: #92400e;
        }

        .score-poor {
            background: rgba(239, 68, 68, 0.15);
            color: #7f1d1d;
        }

        .grade-badge {
            display: inline-block;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 13px;
            width: 45px;
            text-align: center;
            letter-spacing: 0.5px;
        }

        .grade-a {
            background: rgba(16, 185, 129, 0.15);
            color: #059669;
        }

        .grade-b {
            background: rgba(59, 130, 246, 0.15);
            color: #1e40af;
        }

        .grade-c {
            background: rgba(245, 158, 11, 0.15);
            color: #92400e;
        }

        .grade-d {
            background: rgba(249, 115, 22, 0.15);
            color: #92400e;
        }

        .grade-f {
            background: rgba(239, 68, 68, 0.15);
            color: #7f1d1d;
        }

        .buttons {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 30px;
        }

        a, button {
            display: inline-block;
            padding: 12px 28px;
            background: var(--primary);
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 600;
            transition: all 0.2s;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
            border: none;
            cursor: pointer;
            font-size: 14px;
            letter-spacing: 0.3px;
        }

        a:hover, button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(99, 102, 241, 0.4);
        }

        a:nth-of-type(2) {
            background: var(--gray-100);
            color: var(--gray-700);
            box-shadow: none;
        }

        a:nth-of-type(2):hover {
            background: var(--gray-200);
            transform: translateY(-2px);
        }

        .print-btn {
            background: var(--success) !important;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3) !important;
        }

        .print-btn:hover {
            box-shadow: 0 8px 25px rgba(16, 185, 129, 0.4) !important;
        }

        .no-results {
            text-align: center;
            padding: 60px 40px;
            color: var(--gray-500);
        }

        .no-results-icon {
            font-size: 48px;
            margin-bottom: 20px;
        }

        .no-results h3 {
            font-size: 20px;
            color: var(--gray-700);
            margin-bottom: 10px;
        }

        @media print {
            body {
                background: white;
            }
            .buttons {
                display: none;
            }
            .container {
                box-shadow: none;
            }
        }

        @media (max-width: 640px) {
            .container {
                padding: 30px 20px;
            }

            .header h1 {
                font-size: 24px;
            }

            .stats {
                grid-template-columns: 1fr;
            }

            table {
                font-size: 12px;
            }

            td, th {
                padding: 12px 8px;
            }

            .buttons {
                flex-direction: column;
            }

            a, button {
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 Assessment Results</h1>
            <p>AI Agent Factory - Performance Analytics</p>
        </div>

        <div id="statsContainer" class="stats"></div>

        <div class="table-section" id="tableContainer">
            <table id="resultsTable">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Score</th>
                        <th>Percentage</th>
                        <th>Grade</th>
                        <th>Date & Time</th>
                    </tr>
                </thead>
                <tbody id="resultsBody">
                </tbody>
            </table>
        </div>

        <div class="buttons">
            <button class="print-btn" onclick="window.print()">🖨️ Print Results</button>
            <a href="/">🔄 Take Quiz Again</a>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const results = {{ results | tojson }};

            if (results.length === 0) {
                document.getElementById('tableContainer').innerHTML = `
                    <div class="no-results">
                        <div class="no-results-icon">📋</div>
                        <h3>No Results Yet</h3>
                        <p>No students have completed the assessment yet.</p>
                    </div>
                `;
                return;
            }

            // Calculate statistics
            const totalStudents = results.length;
            const totalScore = results.reduce((sum, r) => sum + parseInt(r.Score), 0);
            const averagePercentage = (totalScore / (totalStudents * 60) * 100).toFixed(1);
            const highestScore = Math.max(...results.map(r => parseInt(r.Score)));

            // Update stats
            const statsHTML = `
                <div class="stat-card">
                    <div class="label">Total Assessments</div>
                    <div class="number">${totalStudents}</div>
                </div>
                <div class="stat-card">
                    <div class="label">Average Score</div>
                    <div class="number">${averagePercentage}%</div>
                </div>
                <div class="stat-card">
                    <div class="label">Highest Score</div>
                    <div class="number">${highestScore}/60</div>
                </div>
            `;
            document.getElementById('statsContainer').innerHTML = statsHTML;

            // Populate table
            let tbody = document.getElementById('resultsBody');
            results.forEach((result, idx) => {
                const percentage = parseFloat(result.Percentage);
                let badgeClass = 'score-excellent';
                if (percentage < 60) badgeClass = 'score-poor';
                else if (percentage < 70) badgeClass = 'score-average';
                else if (percentage < 85) badgeClass = 'score-good';

                const grade = result.Grade || '-';
                let gradeClass = 'grade-a';
                if (grade === 'B') gradeClass = 'grade-b';
                else if (grade === 'C') gradeClass = 'grade-c';
                else if (grade === 'D') gradeClass = 'grade-d';
                else if (grade === 'F') gradeClass = 'grade-f';

                const row = `
                    <tr>
                        <td class="rank">${idx + 1}</td>
                        <td class="name">${result.Name}</td>
                        <td>${result.Email}</td>
                        <td><strong>${result.Score}</strong>/60</td>
                        <td><span class="score-badge ${badgeClass}">${result.Percentage}</span></td>
                        <td><span class="grade-badge ${gradeClass}">${grade}</span></td>
                        <td>${result.Timestamp}</td>
                    </tr>
                `;
                tbody.innerHTML += row;
            });
        });
    </script>
</body>
</html>
