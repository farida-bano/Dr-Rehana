<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Results - AI Agent Factory</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            color: #667eea;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 14px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-card .number {
            font-size: 32px;
            font-weight: bold;
            margin: 10px 0;
        }

        .stat-card .label {
            font-size: 12px;
            opacity: 0.9;
        }

        .table-section {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 30px;
        }

        thead {
            background: #f8f9ff;
            border-bottom: 2px solid #667eea;
        }

        th {
            padding: 15px;
            text-align: left;
            font-weight: 600;
            color: #667eea;
            font-size: 13px;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid #eee;
            color: #333;
            font-size: 14px;
        }

        tbody tr:hover {
            background: #f8f9ff;
        }

        .score-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 12px;
        }

        .score-excellent {
            background: #d1fae5;
            color: #065f46;
        }

        .score-good {
            background: #bfdbfe;
            color: #1e40af;
        }

        .score-average {
            background: #fef3c7;
            color: #92400e;
        }

        .score-poor {
            background: #fee2e2;
            color: #7f1d1d;
        }

        .buttons {
            text-align: center;
            margin-top: 30px;
        }

        a {
            display: inline-block;
            padding: 12px 30px;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: 600;
            transition: all 0.3s;
            margin: 0 10px;
        }

        a:hover {
            background: #5568d3;
        }

        .no-results {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .print-btn {
            background: #10b981;
        }

        .print-btn:hover {
            background: #059669;
        }

        @media print {
            body {
                background: white;
            }
            .buttons {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 Quiz Results</h1>
            <p>AI Agent Factory - Exam Performance Analysis</p>
        </div>

        <div id="statsContainer" class="stats"></div>

        <div class="table-section" id="tableContainer">
            <table id="resultsTable">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Score</th>
                        <th>Percentage</th>
                        <th>Date & Time</th>
                    </tr>
                </thead>
                <tbody id="resultsBody">
                </tbody>
            </table>
        </div>

        <div class="buttons">
            <button class="print-btn" onclick="window.print()" style="border: none; cursor: pointer;">🖨️ Print Results</button>
            <a href="/">← Take Quiz</a>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const results = {{ results | tojson }};

            if (results.length === 0) {
                document.getElementById('tableContainer').innerHTML = '<div class="no-results">No results yet. No students have completed the quiz.</div>';
                return;
            }

            // Calculate statistics
            const totalStudents = results.length;
            const totalScore = results.reduce((sum, r) => sum + parseInt(r.Score), 0);
            const averagePercentage = (totalScore / (totalStudents * 60) * 100).toFixed(1);
            const highestScore = Math.max(...results.map(r => parseInt(r.Score)));

            // Update stats
            const statsHTML = `
                <div class="stat-card">
                    <div class="label">Total Students</div>
                    <div class="number">${totalStudents}</div>
                </div>
                <div class="stat-card">
                    <div class="label">Average Score</div>
                    <div class="number">${averagePercentage}%</div>
                </div>
                <div class="stat-card">
                    <div class="label">Highest Score</div>
                    <div class="number">${highestScore}/60</div>
                </div>
            `;
            document.getElementById('statsContainer').innerHTML = statsHTML;

            // Populate table
            let tbody = document.getElementById('resultsBody');
            results.forEach((result, idx) => {
                const percentage = parseFloat(result.Percentage);
                let badgeClass = 'score-excellent';
                if (percentage < 60) badgeClass = 'score-poor';
                else if (percentage < 70) badgeClass = 'score-average';
                else if (percentage < 85) badgeClass = 'score-good';

                const row = `
                    <tr>
                        <td>${idx + 1}</td>
                        <td>${result.Name}</td>
                        <td>${result.Email}</td>
                        <td><strong>${result.Score}</strong>/60</td>
                        <td><span class="score-badge ${badgeClass}">${result.Percentage}</span></td>
                        <td>${result.Timestamp}</td>
                    </tr>
                `;
                tbody.innerHTML += row;
            });
        });
    </script>
</body>
</html>
